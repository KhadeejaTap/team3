```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Animal Management</h1>
    <p>Enter the animal's information below.</p>

    <form id="animalForm">
        <label for="name">Animal Name:</label>
        <input type="text" id="name" name="name" maxlength="100">

        <label for="species_ID">Species:</label>
        <input type="number" id="species_ID" name="species_ID" required>

        <label for="enclosure_ID">Enclosure ID:</label>
        <input type="number" id="enclosure_ID" name="enclosure_ID" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="0">

        <label for="gender">Gender:</label>
        <input type="text" id="gender" name="gender" maxlength="20">

        <label for="weight">Weight:</label>
        <input type="number" id="weight" name="weight" min="0" step="0.01">

        <label for="arrival_date">Arrival Date:</label>
        <input type="date" id="arrival_date" name="arrival_date">

        <label for="breeding_status">Breeding Status:</label>
        <input type="text" id="breeding_status" name="breeding_status" maxlength="50">

        <button type="submit">Save Animal</button>
    </form>

    <script src="animal-module.js"></script>
</body>
</html>
